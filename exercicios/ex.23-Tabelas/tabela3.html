<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        table{
            border-collapse: collapse;
        
        }
        td{
            padding: 20px;
            text-align: center;
            border: 2px solid black;
        }
    </style>
    <title>Mesclagem de células</title>
</head>
<body>
    <table>
        <tr>
            <td colspan="2">A</td>
            <td rowspan="3">C</td>
        </tr>
        <tr>
            <td rowspan="2">D</td>
            <td>E</td>
            
        </tr>
        <tr>
        
            <td>H</td>
            
        </tr>
    </table>
</body>
</html>
