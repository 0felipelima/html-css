<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        table{
            width: 40em;
            height: 10em;
            border-collapse: collapse;
        }
        .marcado{
            background-color: aquamarine;
        }
        .celula{
            background-color: #00724c6e;
        }
        td{
            text-align: center;
            padding: 10px;
            border: 1px solid rgb(0, 0, 58);
        }
        a{
            display: block;
            margin-top: 50px ;
            padding: 5px;
            width: 100px;
            border-radius: 4px;
            text-decoration: none;
            color: rgb(11, 26, 6);
            background-color: rgb(64, 151, 86);
            box-shadow: 2px 2px 2px 0px rgba(0, 0, 0, 0.486);
        }
        a:active{
            display: block;
            margin-top: 50px ;
            padding: 2px;
            width: 100px;
            border-radius: 4px;
            text-decoration: none;
            color: #ffffff;
            background-color: rgba(0, 100, 42, 0.993);
            box-shadow: inset 2px 2px 2px 0px rgba(0, 0, 0, 0.486);
        }
    </style>
    <title>Criando tabelas</title>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!-- 
    Hierarquia de tabela simples
    Table
    Table row
    table header
    table data
    -->
    <table>
        <tr class="marcado"><!--Primeira linha-->
            <td>A1</td>
            <td>B1</td>
            <td class="celula">C1</td>
            <td>D1</td>
        </tr>
         <tr><!--Primeira linha-->
            <td>A2</td>
            <td>B2</td>
            <td class="celula">C2</td>
            <td>D2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
            <td class="celula">D3</td>
        </tr>
    </table>

     <a href="tabela2.html">Proxima tabela</a>
</body>
</html>
