<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        table {
            width: 40em;
            border-collapse: collapse;
        }
        th{
            background-color: rgb(44, 70, 50);
            color: white;
        }
        td,
        th {
            text-align: center;
            padding: 10px;
            border: 1px solid black;
        }
        .media{
background-color: rgb(166, 211, 157);        }
    </style>
    <title>Boletim</title>
</head>

<body>
    <table>
        <thead>

            <th scope="col" rowspan="2">Área</th>
            <th scope="col" rowspan="2">Disciplinas</th>
            <th scope="colgroup" colspan="2">Notas</th>
            <th scope="col" rowspan="2">Média</th>
            <tr>
                <th scope="col">nota 1</th>
                <th scope="col">nota 2</th>
            </tr>

        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td class="media">0.0</td>

            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td class="media">0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td  class="media">0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td  class="media">0.0</td>
            </tr>
            <tr>
                <th colspan="4" scope="row">Média de Exatas</th>
                <td  class="media">0.0</td>
            </tr>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td  class="media">0.0</td>

            <tr>
                <td>Geografia</td>
                <td >0.0</td>
                <td >0.0</td>
                <td  class="media">0.0</td>
            </tr>
            <tr>
                <th colspan="4">Média de humanas</th>
                <td class="media">0.0</td>
            </tr>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="4" scope="row">Média Geral</th>
                <td  class="media">0.0</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
